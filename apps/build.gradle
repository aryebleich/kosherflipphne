plugins {
    id "com.android.application" version "8.11.1" apply false
}

// Shared Android settings for the three KosherFlip apps.
ext.configureKosherApp = { project, String appId ->
    project.android {
        namespace appId
        compileSdk 36

        defaultConfig {
            applicationId appId
            minSdk 26          // Android 8+: runs on existing Android (and Android Go) flip phones too
            targetSdk 36       // Android 16
            // CI build number = version, so every release updates the previous one.
            def build = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int
            versionCode build
            versionName "1.1.${build}"
        }

        signingConfigs {
            release {
                // Your private release key (CI secrets / environment, see signing/README.md).
                def ks = System.getenv("KOSHERFLIP_KEYSTORE")
                if (ks) {
                    storeFile project.file(ks)
                    storePassword System.getenv("KOSHERFLIP_KEYSTORE_PASSWORD")
                    keyAlias System.getenv("KOSHERFLIP_KEY_ALIAS")
                    keyPassword System.getenv("KOSHERFLIP_KEY_PASSWORD")
                }
            }
        }

        buildTypes {
            release {
                minifyEnabled false
                // Without a private key, builds are signed with a throw-away debug key:
                // fine for testing, but they can't update each other.
                signingConfig System.getenv("KOSHERFLIP_KEYSTORE") ? signingConfigs.release : signingConfigs.debug
            }
        }

        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }

        lint {
            // CI runs lintRelease: fail on any API call newer than minSdk (old flip phones).
            checkOnly += ["NewApi"]
            abortOnError true
            checkReleaseBuilds false
        }

        packaging {
            resources {
                excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*",
                             "META-INF/INDEX.LIST", "META-INF/versions/9/OSGI-INF/MANIFEST.MF",
                             "META-INF/*.md"]
            }
        }
    }
}
