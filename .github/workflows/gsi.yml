name: Build KosherFlip Android 16 image (GSI)

# Builds KosherFlip into a ready-made Android 16 Generic System Image (no AOSP
# compile needed, fits GitHub's free runners) and publishes it as a
# pre-release, together with the files and script to flash a CAT S22 Flip.
on:
  workflow_dispatch:
    inputs:
      device:
        description: "cat-s22 (32-bit image + calling settings) or generic-arm64"
        default: "cat-s22"
      base_url:
        description: "Android 16 GSI .img.xz URL (blank = newest TrebleDroid Android 16 image for the device)"
        default: ""
      variant:
        description: "TrebleDroid variant to pick (vanilla = no Google apps, gapps = with Google apps)"
        default: "vanilla"

permissions:
  contents: write

jobs:
  gsi:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          # Quick wins only (deleting the preinstalled Android SDK takes very long).
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL &
          sudo docker image prune -af >/dev/null 2>&1 &
          wait
          df -h /

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q erofs-utils attr android-sdk-libsparse-utils apksigner xz-utils e2fsprogs

      - name: Get the KosherFlip apps (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apks
          gh release download --repo "$GITHUB_REPOSITORY" --dir apks \
            -p KosherGuard.apk -p FlipLauncher.apk -p KosherBrowser.apk -p KosherAI.apk -p KosherKeys.apk
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName > apks/version.txt
          ls -la apks

      - name: Find the Android 16 base image
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_URL: ${{ inputs.base_url }}
          VARIANT: ${{ inputs.variant }}
          # The CAT S22 Flip runs a 32-bit userspace on a 64-bit kernel: "arm32_binder64" ("a64") images.
          ARCH: ${{ inputs.device == 'cat-s22' && 'arm32_binder64' || 'arm64' }}
        run: |
          if [[ -n "$BASE_URL" ]]; then echo "url=$BASE_URL" >> "$GITHUB_OUTPUT"; exit 0; fi
          gh api "repos/TrebleDroid/treble_experimentations/releases?per_page=30" > releases.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys
          variant = os.environ.get("VARIANT") or "vanilla"
          arch = os.environ["ARCH"]
          rel = sorted(json.load(open("releases.json")), key=lambda r: r["published_at"] or "", reverse=True)
          def is_a16(r):
              text = " ".join([r.get("name") or "", r.get("tag_name") or "", (r.get("body") or "")[:300]])
              return re.search(r"(android_16|android 16|\bA16\b|16\.0\.0|baklava)", text, re.I)
          for r in rel:
              if not is_a16(r):
                  continue
              names = [a["name"] for a in r["assets"]]
              print("Android 16 release %s assets: %s" % (r["tag_name"], names), file=sys.stderr)
              def ok(n):
                  n = n.lower()
                  # "-old" = only VNDK 28/29 (Android 9/10 vendors); the S22 has an Android 11 vendor.
                  wrong_arch = ("arm32" in n) if arch == "arm64" else (arch not in n)
                  return (n.endswith(".img.xz") and not wrong_arch and variant in n
                          and not any(x in n for x in ("-old", "vndklite", "secure")))
              exact = [a for a in r["assets"] if a["name"].lower() == "system-td-%s-%s.img.xz" % (arch, variant)]
              picks = exact or [a for a in r["assets"] if ok(a["name"])]
              if picks:
                  print("url=" + picks[0]["browser_download_url"])
                  print("Chose " + picks[0]["name"] + " from " + r["html_url"], file=sys.stderr)
                  sys.exit(0)
          sys.exit("No Android 16 " + arch + " %s image found on TrebleDroid's releases; run again with base_url set." % variant)
          PY

      - name: Download base image
        run: |
          echo "Base: ${{ steps.base.outputs.url }}"
          curl -fL --retry 3 -o base.img.xz "${{ steps.base.outputs.url }}"
          xz -d -T0 base.img.xz   # removes the .xz when done
          ls -la base.img; df -h /

      - name: Android test keys and vbmeta
        run: |
          # Android's public test keys (identical in every release), from the official GitHub mirror.
          mkdir -p keys
          for f in platform.pk8 platform.x509.pem; do
            curl -fsSL -o "keys/$f" "https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/$f"
          done
          openssl x509 -in keys/platform.x509.pem -noout -subject
          # vbmeta with verification disabled (flag 2), as the S22 Flip needs for a GSI
          python3 scripts/make-vbmeta-disabled.py vbmeta-disabled.img

      - name: Build KosherFlip into the image
        run: |
          export KOSHERFLIP_VERSION="$(cat apks/version.txt)"
          export DEVICE="${{ inputs.device }}"
          sudo -E rom/gsi/inject.sh base.img apks kosherflip-system.img keys
          rm -f base.img

      - name: Package
        id: pkg
        run: |
          NAME="kosherflip-android16-${{ inputs.device }}-${{ inputs.variant }}-$(date +%Y%m%d)"
          mkdir -p out
          xz -T0 -6 -c kosherflip-system.img > "out/$NAME.img.xz" && rm -f kosherflip-system.img
          cp vbmeta-disabled.img scripts/flash-s22.sh out/
          (cd out && sha256sum * > SHA256SUMS)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la out

      - name: Publish (pre-release, does not replace the app releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gsi-${{ github.run_number }}
          name: "KosherFlip Android 16 image ${{ github.run_number }} (${{ inputs.device }})"
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            KosherFlip built into an Android 16 GSI for **${{ inputs.device }}**
            (CAT S22 Flip: 32-bit arm32_binder64 image with VoLTE settings; install the Qualcomm IMS
            app from Treble settings after the first boot - see the guide).
            Base image: ${{ steps.base.outputs.url }}
            Flashing guide for the CAT S22 Flip: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/S22-ANDROID16.md

            **Erases the phone. Needs an unlockable bootloader. Test calls before relying on it.**
          files: out/*
